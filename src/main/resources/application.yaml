spring:
  application:
    name: pizzaShop

  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update

  datasource:
    platform: postgres
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pizza_db}
    username: ${DB_USER:pizza_user}
    password: ${DB_PASSWORD:pizza123}
    driverClassName: org.postgresql.Driver

#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}

#  cache:
#    type: redis

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org:
      springframework:
        messaging: DEBUG
        web:
          socket: DEBUG

